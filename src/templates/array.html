<!DOCTYPE html>
<html>
<head>
    <title>Chart Test</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <h1>{{ name }}</h1>

    <canvas id="myChart"></can&datavas>

    <script>
        const points = [
            {% for p in points %}
                {{ p }}{% if not loop.last %},{% endif %}
            {% endfor %}
        ];

        const labels = points.map((_, i) => i);

        new Chart(document.getElementById('myChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Points',
                    data: points,
                    borderColor: 'blue',
                    tension: 0.1
                }]
            }
        });
    </script>
</body>
</html>
