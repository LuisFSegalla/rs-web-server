[package]
name = "web-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name="main"
path="src/main.rs"

[dependencies]
actix = "0.13.5"
actix-web = "4"
actix-web-actors = "4.3.1"
actix-ws = "0.4.0"
bytemuck = "1.25.2"
env_logger = "0.11.11"
futures-util = "0.3.32"
log = "0.4.33"
rand = "0.10.2"
serde = {version="1.0.228", features=["derive"]}
serde_json = "1.0.150"
tera = "2"
tokio = {version = "1.52.3", features = ["sync", "rt-multi-thread"]}
zeromq = "0.6.0"
